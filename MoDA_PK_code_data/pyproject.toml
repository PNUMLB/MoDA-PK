[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moda-pk-revised"
version = "0.1.0"
description = "MoDA-PK model implementation and revised aggregate-result reproduction"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "torch"]

[project.optional-dependencies]
full-analysis = ["pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["moda_pk", "moda_training"]
package-dir = {"" = "src"}
